# The children join a minute apart, so Membership.by_role lists them Charlie, Eli, Sofia every run rather than
# in whatever order the rows happen to sit.
child_in_home:
  household: home
  user: child
  role: child
  created_at: <%= 3.minutes.ago %>

former_in_home:
  household: home
  user: former
  role: adult
  active: false

outsider_in_other:
  household: other
  user: outsider
  role: head

grandparent_in_parents:
  household: parents
  user: grandparent
  role: head

eli_in_home:
  household: home
  user: eli
  role: child
  created_at: <%= 2.minutes.ago %>

sofia_in_home:
  household: home
  user: sofia
  role: child
  created_at: <%= 1.minutes.ago %>
