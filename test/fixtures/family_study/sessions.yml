<% one_off = 3.days.from_now.to_date.in_time_zone.change(hour: 19) %>
one_off_first:
  family_study: one_off
  recurrence_at: <%= one_off %>
  scheduled_at: <%= one_off %>
  topic: Draw Close to Jehovah, chapter 1

<% weekly = 6.days.ago.to_date.in_time_zone.change(hour: 19) %>
weekly_past:
  family_study: weekly
  recurrence_at: <%= weekly %>
  scheduled_at: <%= weekly %>
  topic: Lessons From the Life of Ruth

weekly_next:
  family_study: weekly
  recurrence_at: <%= weekly + 1.week %>
  scheduled_at: <%= weekly + 1.week %>

weekly_cancelled:
  family_study: weekly
  recurrence_at: <%= weekly + 2.weeks %>
  scheduled_at: <%= weekly + 2.weeks %>
  canceled_at: <%= Time.current %>

weekly_later:
  family_study: weekly
  recurrence_at: <%= weekly + 3.weeks %>
  scheduled_at: <%= weekly + 3.weeks %>
