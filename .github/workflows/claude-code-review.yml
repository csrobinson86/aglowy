# AI review on every pull request, posted as inline comments.
# It sits on top of CI's hard gates (tests, coverage, rubocop, brakeman,
# bundler-audit) and never approves or blocks a merge.
#
# Setup: the CLAUDE_CODE_OAUTH_TOKEN secret, created by /install-github-app
# (or `claude setup-token`). To use a Claude Console API key instead, add an
# ANTHROPIC_API_KEY secret and swap the claude_code_oauth_token line for:
#   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
#
# Review rules: REVIEW.md and CLAUDE.md in this repository.
# Workflow shape follows https://code.claude.com/docs/en/github-actions

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
