production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
  extend_family_study_sessions:
    class: FamilyStudies::ExtendSessionsJob
    schedule: every day at 3am
  purge_expired_ai_chats:
    class: Ai::PurgeExpiredChatsJob
    schedule: every day at 4am
  purge_old_daily_briefs:
    class: DailyBrief::PurgeJob
    schedule: every day at 4:15am
  purge_expired_ai_uses:
    class: Ai::PurgeExpiredUsesJob
    schedule: every day at 4:30am
  send_weekly_previews:
    class: Notification::WeeklyPreviewJob
    schedule: every hour at minute 5
  ask_for_study_topics:
    class: Notification::StudyTopicJob
    schedule: every hour at minute 10
  follow_up_invitations:
    class: Notification::InvitationFollowUpJob
    schedule: every day at 2pm
  send_daily_summaries:
    class: Notification::DailySummaryJob
    schedule: every 15 minutes
  purge_old_notifications:
    class: Notification::PurgeJob
    schedule: every day at 4:45am
  prepare_daily_briefs:
    class: DailyBrief::PrepareJob
    schedule: every 15 minutes
