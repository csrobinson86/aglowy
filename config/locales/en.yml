# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  time:
    formats:
      session: "%a, %b %-d · %-l:%M %p"
      session_day: "%A, %B %-d, %Y"
      next_session: "%A, %B %-d"
      next_card: "%A, %b %-d"
      session_breadcrumb: "%b %-d, %Y"
      step_study: "%a, %b %-d"
      clock: "%-l:%M"
      clock_with_meridiem: "%-l:%M %p"
  activerecord:
    errors:
      models:
        invitation:
          attributes:
            email:
              # "Already a member of this household.", not "Email Already a member…" (docs/design/invitations.md).
              format: "%{message}"
              taken: "Already invited. Resend it from the Members page."
    attributes:
      identity:
        login: "Email or username"
      family_study/resource:
        url: "Link"
      household/event:
        all_day: "All day"
        starts_on: "Starts"
        ends_on: "Ends"
        starts_at: "Starts"
        ends_at: "Ends"
        repeat: "Repeats"
        location: "Where"
      meeting_note/answer:
        body: "What I'll say"
  activemodel:
    attributes:
      family_study/scheduling:
        link_url: "Link"
